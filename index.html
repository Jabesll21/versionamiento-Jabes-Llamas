<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis productos</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="pageHeader">
        <p class="eyebrow">GESTOR DE PRODUCTOS</p>
        <h1>Mis productos</h1>
        <p class="pageSubtitle">Organiza y administra tus productos en un solo lugar.</p>
    </header>

    <div class="container">
        <form class="formContainer" id="productForm">
            <div class="formHeading">
                <span class="formIcon" aria-hidden="true">+</span>
                <div>
                    <h2>Agregar producto</h2>
                    <p>Ingresa los datos del producto</p>
                </div>
            </div>
            
            <label for="name">Nombre del producto</label>
            <input type="text" id="name" placeholder="Ej. Cuaderno azul" autocomplete="off">
            
            <label for="price">Precio</label>
            <input type="number" id="price" placeholder="Ej. 19.99" min="0.01" step="0.01">

            <button id="addProduct" type="submit">Agregar producto</button>
        </form>

        <section class="productsSection" aria-labelledby="productsHeading">
            <div class="sectionHeading">
                <div>
                    <p class="eyebrow">TU INVENTARIO</p>
                    <h2 id="productsHeading">Lista de productos</h2>
                </div>
            </div>
            <div id="productsList" class="productsList"></div>
        </section>
    </div>


    <script src="functions.js"></script>
</body>
</html>
